<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>General G1.0.0 α3 Diagnostic</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:760px;margin:24px auto;padding:0 14px;color:#172033}pre{white-space:pre-wrap;background:#f5f7fb;border:1px solid #e4e8f0;border-radius:12px;padding:14px;line-height:1.55}button{padding:10px 14px;border:0;border-radius:10px;background:#3157d5;color:#fff;font-weight:700;margin-right:6px;margin-bottom:6px}</style></head><body><h2>G1.0.0-alpha3 진단</h2><p>구조/마이크/STT Relay 상태 확인용입니다. 비밀값을 화면에 출력하지 않습니다.</p><button id="run">자가검사</button><button id="relay">STT Relay 확인</button><pre id="out">대기</pre><script>'use strict';const O=document.getElementById('out'),DEF='https://lao-stt-relay-460077888071.asia-northeast3.run.app';const get=k=>{try{return sessionStorage.getItem(k)||''}catch(_){return''}};document.getElementById('run').onclick=()=>{const AC=window.AudioContext||window.webkitAudioContext,lines=[];lines.push('version=G1.0.0-alpha3');lines.push('page='+location.href);lines.push('secureContext='+window.isSecureContext);lines.push('fetch='+(typeof fetch==='function'?'PASS':'FAIL'));lines.push('WebSocket='+(typeof WebSocket==='function'?'PASS':'FAIL'));lines.push('AbortController='+(typeof AbortController==='function'?'PASS':'FAIL'));lines.push('mediaDevices='+(navigator.mediaDevices?'PASS':'FAIL'));lines.push('getUserMedia='+(typeof navigator.mediaDevices?.getUserMedia==='function'?'PASS':'FAIL'));lines.push('AudioContext='+(AC?'PASS':'FAIL'));lines.push('sessionStorage='+(()=>{try{sessionStorage.setItem('__gtest','1');sessionStorage.removeItem('__gtest');return'PASS'}catch(e){return'FAIL'}})());lines.push('relayUrl='+(get('general_stt_relay_url_v1')||DEF));lines.push('relayToken='+(get('general_stt_app_token_v1')?'PRESENT':'MISSING'));lines.push('note=Chirp 3 live microphone test is performed in index.html');O.textContent=lines.join('\n')};document.getElementById('relay').onclick=async()=>{const u=(get('general_stt_relay_url_v1')||DEF).replace(/\/+$/,''),t=get('general_stt_app_token_v1');if(!t){O.textContent='STT App Token MISSING\nindex.html 설정에서 먼저 적용하세요.';return}O.textContent='STT Relay 확인 중...';const c=new AbortController(),timer=setTimeout(()=>c.abort(),6500);try{const r=await fetch(u+'/health',{headers:{'Accept':'application/json','X-App-Token':t},signal:c.signal,cache:'no-store'});const x=await r.text();O.textContent='status='+r.status+'\nbody='+x.slice(0,1000)}catch(e){O.textContent='FAIL '+(e?.name||'Error')+': '+(e?.message||e)}finally{clearTimeout(timer)}};</script></body></html>
