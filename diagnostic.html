<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>General G1.0.0 α2 Diagnostic</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:760px;margin:24px auto;padding:0 14px;color:#172033}pre{white-space:pre-wrap;background:#f5f7fb;border:1px solid #e4e8f0;border-radius:12px;padding:14px;line-height:1.55}button{padding:10px 14px;border:0;border-radius:10px;background:#3157d5;color:#fff;font-weight:700}</style></head><body><h2>G1.0.0-alpha2 진단</h2><p>이 페이지는 구조 확인용입니다. 비밀값을 포함하지 않습니다.</p><button id="run">자가검사</button><pre id="out">대기</pre><script>'use strict';document.getElementById('run').onclick=()=>{const lines=[];lines.push('version=G1.0.0-alpha2');lines.push('page='+location.href);lines.push('secureContext='+window.isSecureContext);lines.push('fetch='+(typeof fetch==='function'?'PASS':'FAIL'));lines.push('AbortController='+(typeof AbortController==='function'?'PASS':'FAIL'));lines.push('sessionStorage='+(()=>{try{sessionStorage.setItem('__gtest','1');sessionStorage.removeItem('__gtest');return'PASS'}catch(e){return'FAIL'}})());lines.push('note=translation/backtranslation live test is performed in index.html after session-only API key setup');document.getElementById('out').textContent=lines.join('\n')};</script></body></html>
