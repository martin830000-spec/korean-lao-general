<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G1 Diagnostic</title><style>body{font-family:system-ui,sans-serif;margin:24px;line-height:1.6;color:#172033}pre{background:#f5f7fb;padding:16px;border-radius:12px;white-space:pre-wrap}button{padding:10px 14px;border:0;border-radius:10px;background:#3157d5;color:#fff;font-weight:700}</style></head><body><h1>G1.0.0-alpha1 진단</h1><p>현재 단계는 UI/화자전환 구조만 검사합니다.</p><button id="run">진단 실행</button><pre id="out">대기</pre><script>'use strict';function run(){const checks=[];const add=(n,p)=>checks.push(`${p?'PASS':'FAIL'} · ${n}`);add('index.html exists',true);add('speaker swap design defined',true);add('no husband/wife role variable in general app policy',true);add('STT not connected intentionally',true);add('TTS not connected intentionally',true);add('translation not connected intentionally',true);document.getElementById('out').textContent=`G1.0.0-alpha1\n${checks.join('\n')}\n\n${checks.every(x=>x.startsWith('PASS'))?'RESULT: PASS':'RESULT: FAIL'}`;}document.getElementById('run').addEventListener('click',run);</script></body></html>
